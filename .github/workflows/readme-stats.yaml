name: Update README stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate light stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&line_height=30&rank_icon=percentile&disable_animations=true&hide_border=true&title_color=B5472B&text_color=8A5A00&icon_color=5C3D1E&ring_color=B5472B&bg_color=00000000
          path: stats-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate light streak card
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&card_width=467&disable_animations=true&hide_border=true&background=00000000&stroke=B5472B&ring=B5472B&fire=B5472B&currStreakNum=5C3D1E&sideNums=5C3D1E&currStreakLabel=B5472B&sideLabels=B5472B&dates=8A5A00
          path: streak-light.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate dark stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_title=true&line_height=30&rank_icon=percentile&disable_animations=true&hide_border=true&theme=calm_pink&bg_color=00000000
          path: stats-dark.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate dark streak card
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&card_width=467&disable_animations=true&hide_border=true&theme=calm-pink&background=00000000
          path: streak-dark.svg
          token: ${{ secrets.GH_PAT }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: readme-stats 🤖
          commit_user_email: actions@github.com
          commit_author: readme-stats 🤖 <actions@github.com>
