name: Update README stats cards

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=calm_pink&hide_title=true&line_height=30&rank_icon=percentile
          path: stats.svg
          # The PAT adds private commits to the totals.
          token: ${{ secrets.GH_PAT }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        with:
          options: user=${{ github.repository_owner }}&theme=calm-pink&card_width=467
          path: streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: readme-stats 🤖
          commit_user_email: actions@github.com
          commit_author: readme-stats 🤖 <actions@github.com>
