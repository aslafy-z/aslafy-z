name: Update README

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate README
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          gh api graphql -F login="$LOGIN" -F query=@.github/readme/query.graphql > "$RUNNER_TEMP/data.json"
          jq -j --arg login "$LOGIN" --rawfile template README.md.tmpl -f .github/readme/render.jq "$RUNNER_TEMP/data.json" > "$RUNNER_TEMP/README.md"
          cp "$RUNNER_TEMP/README.md" README.md

      - uses: stefanzweifel/git-auto-commit-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          commit_message: Update generated README
          branch: main
          commit_user_name: readme-scribe 🤖
          commit_user_email: actions@github.com
          commit_author: readme-scribe 🤖 <actions@github.com>
